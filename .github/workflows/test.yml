name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    name: Tests (${{ matrix.os }}, Nix beta)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run tests
        run: nix develop .#ci -c cargo test --workspace --all-features --locked

  windows:
    name: Tests (Windows, beta)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust beta
        run: rustup toolchain install beta --profile minimal
      - name: Run tests
        run: rustup run beta cargo test --workspace --all-features --locked
