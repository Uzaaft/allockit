name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    name: Tests (${{ matrix.os }}, Nix beta)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-ci-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-ci-
      - name: Prepare test shell
        run: nix develop .#ci -c true
      - uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-ci-${{ hashFiles('flake.nix', 'flake.lock') }}
      - name: Run tests
        run: nix develop .#ci -c cargo test --workspace --all-features --locked

  miri:
    name: Miri (${{ matrix.os }}, Nix nightly)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-miri-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-miri-
      - name: Prepare Miri shell
        run: nix develop .#miri -c true
      - uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-miri-${{ hashFiles('flake.nix', 'flake.lock') }}
      - name: Run Miri tests
        run: nix develop .#miri -c cargo miri test --workspace --all-features --locked --no-fail-fast

  windows:
    name: Tests (Windows, beta)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust beta
        run: rustup toolchain install beta --profile minimal
      - name: Run tests
        run: rustup run beta cargo test --workspace --all-features --locked
