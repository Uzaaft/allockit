[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/uzaaft/allockit"

[workspace.dependencies]
arena-allocator = { path = "crates/arena-allocator", version = "0.1.0", default-features = false }
atomic-fixed-buffer-allocator = { path = "crates/atomic-fixed-buffer-allocator", version = "0.1.0", default-features = false }
buffer-first-allocator = { path = "crates/buffer-first-allocator", version = "0.1.0", default-features = false }
failing-allocator = { path = "crates/failing-allocator", version = "0.1.0", default-features = false }
fixed-buffer-allocator = { path = "crates/fixed-buffer-allocator", version = "0.1.0", default-features = false }
page-allocator = { path = "crates/page-allocator", version = "0.1.0", default-features = false }
safe-allocator = { path = "crates/safe-allocator", version = "0.1.0", default-features = false }
smp-allocator = { path = "crates/smp-allocator", version = "0.1.0", default-features = false }

[workspace.metadata.crane]
name = "allockit"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
