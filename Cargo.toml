[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/uzaaft/allockit"

[workspace.dependencies]
failing-allocator = { path = "crates/failing-allocator", version = "0.1.0" }

[workspace.metadata.crane]
name = "allockit"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
