[package]
name = "allockit"
description = "Composable allocators for Rust's Allocator trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
arena-allocator = { workspace = true, optional = true }
atomic-fixed-buffer-allocator = { workspace = true, optional = true }
buffer-first-allocator = { workspace = true, optional = true }
failing-allocator = { workspace = true, optional = true }
fixed-buffer-allocator = { workspace = true, optional = true }
page-allocator = { workspace = true, optional = true }

[features]
default = ["std"]
std = ["arena-allocator?/std", "atomic-fixed-buffer-allocator?/std", "buffer-first-allocator?/std", "failing-allocator?/std", "fixed-buffer-allocator?/std", "page-allocator?/std"]
arena-allocator = ["dep:arena-allocator"]
atomic-fixed-buffer-allocator = ["dep:atomic-fixed-buffer-allocator"]
buffer-first-allocator = ["dep:buffer-first-allocator"]
failing-allocator = ["dep:failing-allocator"]
fixed-buffer-allocator = ["dep:fixed-buffer-allocator"]
page-allocator = ["dep:page-allocator"]

[package.metadata.docs.rs]
all-features = true
