[package]
name = "allockit"
description = "Composable allocators for Rust's Allocator trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
failing-allocator = { workspace = true, optional = true }

[features]
default = ["std"]
std = ["failing-allocator?/std"]
failing-allocator = ["dep:failing-allocator"]

[package.metadata.docs.rs]
all-features = true
